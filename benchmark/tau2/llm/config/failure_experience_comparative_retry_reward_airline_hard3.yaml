extends: baseline.yaml

benchmark:
  name: tau2_failure_experience_comparative_retry_reward_airline_hard3
  domains:
    - airline
  repeat_count: 2
  strategy_concurrency: 2
  task_max_concurrency: 3
  corpus_prepare_concurrency: 1

paths:
  train_results_files:
    airline: ${TAU2_AIRLINE_TRAIN_RESULTS_FILE:-}

openviking:
  agent_experience_failure_integration_mode: comparative_insight

strategies:
  - id: no_memory
    label: TAU-2 no-memory same-seed baseline
    memory_backend: none

  - id: failure_exp_comparative_reward_retry2_top4_prewrite_top2
    label: Comparative-insight reward-info corpus with failed-task retry x2
    memory_backend: openviking
    train_required: true
    corpus_id: failure_exp_comparative_reward_info_retry_v1
    train_memory_mode: experience_only
    train_transcript_format: role_tool_blocks
    train_outcome_mode: reward_info
    train_include_system_prompt: true
    train_skip_failed_sessions: false
    failed_task_retry_count: 2
    failed_task_retry_outcome_mode: reward_info
    agent_experience_failure_integration_mode: comparative_insight
    search_memory_type: experiences
    retrieval_mode: first_user_prewrite
    retrieval_top_k: 4
    first_user_inject_top_k: 4
    prewrite_retrieval_top_k: 2
    prewrite_inject_top_k: 2
    scope_prompt_file: benchmark/tau2/llm/config/scope_prompts/generic_memory_scope.md
